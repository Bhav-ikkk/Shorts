<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rig v2 Action Showcase</title>
  <style>
    @font-face {
      font-family: BR;
      font-weight: 800;
      src: url(../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; background: #0b0e14; overflow: hidden; }
    #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
    canvas { position: absolute; left: 0; top: 0; }
    #hud {
      position: absolute; left: 0; top: 80px; width: 1080px; text-align: center;
      font: 800 48px/1 BR; color: #fff; letter-spacing: 0.08em; pointer-events: none;
    }
    #label {
      position: absolute; left: 0; top: 180px; width: 1080px; text-align: center;
      font: 800 84px/1 BR; color: #FFD21F; -webkit-text-stroke: 16px #0b0b12; paint-order: stroke fill;
      letter-spacing: 0.04em; pointer-events: none; text-shadow: 0 10px 0 rgba(0,0,0,0.4);
    }
    #counter {
      position: absolute; left: 0; top: 290px; width: 1080px; text-align: center;
      font: 800 36px/1 BR; color: #8a9bb0; pointer-events: none;
    }
    #badge {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 120px;
      font: 800 32px/1 BR; color: #fff; background: rgba(15, 23, 42, 0.85);
      border: 3px solid rgba(255, 210, 31, 0.4); border-radius: 16px; padding: 16px 36px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div id="hud">BLOCKY RIG V2 · BIOMECHANICS REPERTOIRE</div>
    <div id="label">IDLE</div>
    <div id="counter">ACTION 1 OF 12</div>
    <div id="badge">TWO-BONE JOINTS · SECONDARY INERTIA · SQUASH & STRETCH</div>
  </div>
  <script type="module" src="showcase.js"></script>
</body>
</html>
