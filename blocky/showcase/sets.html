<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sets & Props Showcase</title>
  <style>
    @font-face {
      font-family: BR;
      font-weight: 800;
      src: url(../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; background: #080b11; overflow: hidden; }
    #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
    canvas { position: absolute; left: 0; top: 0; }
    #hud {
      position: absolute; left: 0; top: 70px; width: 1080px; text-align: center;
      font: 800 44px/1 BR; color: #94a3b8; letter-spacing: 0.1em; pointer-events: none;
    }
    #label {
      position: absolute; left: 0; top: 155px; width: 1080px; text-align: center;
      font: 800 84px/1 BR; color: #38bdf8; -webkit-text-stroke: 16px #090d16; paint-order: stroke fill;
      letter-spacing: 0.04em; pointer-events: none; text-shadow: 0 10px 0 rgba(0,0,0,0.5);
    }
    #counter {
      position: absolute; left: 0; top: 270px; width: 1080px; text-align: center;
      font: 800 36px/1 BR; color: #cbd5e1; pointer-events: none;
    }
    #badge {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px;
      font: 800 28px/1 BR; color: #fff; background: rgba(15, 23, 42, 0.92);
      border: 3px solid rgba(56, 189, 248, 0.45); border-radius: 16px; padding: 18px 40px;
      text-align: center; width: 920px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div id="hud">BLOCKY STORY ENGINE · SETS & PROPS SYSTEM</div>
    <div id="label">KITCHEN</div>
    <div id="counter">SET 1 OF 6 · DAY MOOD</div>
    <div id="badge">6 PROCEDURAL SETS · 40+ LOW-POLY PROPS · 4 LIGHTING MOODS</div>
  </div>
  <script type="module" src="sets.js"></script>
</body>
</html>
